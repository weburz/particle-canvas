packages:
  - playground
overrides:
  # Force a single Vue version across the graph. @nuxt/test-utils pins vue@3.5.34
  # while nuxt/playground use 3.5.38; the duplicate produces two distinct `Ref`
  # types and breaks `vue-tsc` on ParticleCanvas.vue. Keep aligned with nuxt's vue.
  vue: 3.5.38
  # Pin volatile browserslist toolchain deps. caniuse-lite and
  # update-browserslist-db ship multiple releases per week; a fresh release
  # fails the 24h minimumReleaseAge supply-chain policy in CI for hours.
  # These are dev-only transitive deps, so staying one minor behind is safe.
  caniuse-lite: 1.0.30001799
  update-browserslist-db: 1.2.3
  # postcss also churns rapidly and trips the same policy; keep the stable
  # minor that main already pins (8.5.14/8.5.15), used by the build tooling.
  #
  # 8.5.15 is vulnerable (GHSA-fxqj-rqcc-2cmp / GHSA-r28c-9q8g-f849, patched
  # in 8.5.18 and 8.5.23), so the pin now holds the highest aged stable
  # instead. 8.5.25 (2026-07-29) is older than the 24h feed and satisfies the
  # patched versions; 8.5.26 was published today UTC.
  postcss: 8.5.25
  # vite publishes several times a week; hold the previous 8.2 minor so the
  # 24h supply-chain policy does not fail CI on a fresh release. Same minor,
  # so the range being bumped is still satisfied.
  vite: 8.2.0
  # tar below 7.5.18 ships a dangling-symlink advisory (GHSA-w8wr-v893-vjvp);
  # hold the latest aged release (7.5.22, 2026-07-24) for the build tooling.
  tar: 7.5.22
  # brace-expansion 5.0.6 is vulnerable (GHSA-3jxr-9vmj-r5cp, patched 5.0.7+).
  # Only the ^5 consumers need the bump; 2.1.4 (used by older tooling) is
  # outside the advisory range and must keep its API, hence the scoped pin.
  brace-expansion@^5: 5.0.9
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
